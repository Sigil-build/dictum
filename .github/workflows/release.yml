# A tag v<version> builds the packages and opens a DRAFT release with them, their provenance attestations (also as
# .intoto.jsonl files) and the SBOM; then virustotal.yml adds links to VirusTotal's reports to its notes. Publishing it is a person's call, and
# publishing runs virustotal.yml again, which puts the section back if the draft's notes were replaced meanwhile.
# The draft exists only once the packages, the SBOM and both attestations are done: if the sbom job or an attestation
# fails, there is no draft, and "Re-run failed jobs" on this run makes it, from the packages this run built.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: The tag names the version the packages are built with
        id: version
        # Its own assignment, so a refused tag fails the step: inside echo, the exit status would be echo's.
        run: |
          version=$(bash packaging/check-version.sh "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  packages:
    needs: check
    uses: ./.github/workflows/packages.yml

  # The SBOM lists the NuGet packages the two programs are built from, with their versions, in SPDX.
  sbom:
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Syft finds .NET packages in packages.lock.json, which the repository does not keep: the restore writes one
      # per project, with every package the project takes in, transitive ones too.
      - name: Restore the programs with lock files
        run: |
          dotnet restore src/Dictum.App/Dictum.App.csproj -p:RestorePackagesWithLockFile=true
          dotnet restore src/Dictum.Cli/Dictum.Cli.csproj -p:RestorePackagesWithLockFile=true

      - name: The SBOM of the source
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SOURCE_NAME: dictum
          SYFT_SOURCE_VERSION: ${{ needs.check.outputs.version }}
        with:
          path: src
          format: spdx-json
          output-file: dictum-${{ needs.check.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dictum-${{ needs.check.outputs.version }}-sbom.spdx.json
          if-no-files-found: error

  release:
    needs: [check, packages, sbom]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      # The attestations: a Sigstore certificate for this run, and GitHub's store that gh attestation verify reads.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The packages this run built: an attestation never covers files from an earlier run or release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: release

      - name: Checksums and the PKGBUILD with the tarball's sum
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$VERSION" ] || { echo "The check job passed on no version." >&2; exit 1; }
          cd release
          sha256sum dictum-* > SHA256SUMS
          sum=$(sha256sum "dictum-$VERSION-linux-x64.tar.gz" | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" ../packaging/linux/aur/PKGBUILD > PKGBUILD
          cat SHA256SUMS

      # After the checksums, which cover the four packages only.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: release

      # Each file of the release, as built by this run of this workflow from this tag.
      - name: Provenance of every release file
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: The SBOM, attested for the packages it describes
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
          sbom-path: release/dictum-${{ needs.check.outputs.version }}-sbom.spdx.json

      # The attestations as files of the release, which verify without GitHub's attestation API: gh attestation verify <file> --bundle <bundle>.
      # Each is a Sigstore bundle, a JSON document; jq -c puts it on one line, as the .intoto.jsonl name says. They
      # come after the checksums and the attestations, so neither covers them.
      - name: The attestations as release files
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          jq -c . "$PROVENANCE_BUNDLE" > "release/dictum-$VERSION.intoto.jsonl"
          jq -c . "$SBOM_BUNDLE" > "release/dictum-$VERSION-sbom.intoto.jsonl"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: >
          gh release create "$GITHUB_REF_NAME" --draft --title "Dictum $VERSION"
          --notes "Dictum $VERSION. Windows: the MSI (per user, no admin rights) or the portable zip. Linux: the AppImage, the tarball with install.sh, or the PKGBUILD (Arch, CachyOS). SHA-256 sums in SHA256SUMS. The SBOM of the source is dictum-$VERSION-sbom.spdx.json. gh attestation verify <file> -R $GITHUB_REPOSITORY checks that a file was built by this release's workflow; with --bundle dictum-$VERSION.intoto.jsonl and -R it checks without GitHub's attestation API (dictum-$VERSION-sbom.intoto.jsonl is the SBOM's attestation)."
          release/*

  # After the draft exists, so that the release is published with the links. Without VIRUSTOTAL_API_KEY it only
  # leaves a notice; when VirusTotal fails, the notes say which package has no report and why, and this job fails.
  virustotal:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
