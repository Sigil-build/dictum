# The docs at docs.sigil.build come from a docs/X.Y branch. A published release cuts docs/X.Y from its tag
# (once: a patch release leaves the branch as it is). docs-site.yml builds the pages on every docs change and
# rebuilds the site after a push to a docs branch.
name: Docs

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  branch:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cut the docs branch from the release tag
        id: cut
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          branch=$(bash packaging/docs-branch.sh "$TAG")
          if [ -z "$branch" ]; then
            echo "::notice::$TAG is a pre-release, so it gets no docs branch."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::$branch exists; merge the release's docs/ changes into it by hand."
            exit 0
          fi
          # ^{commit} peels an annotated tag: a branch can only point at a commit.
          git push origin "refs/tags/$TAG^{commit}:refs/heads/$branch"

      # A push made with GITHUB_TOKEN starts no workflow, so the new branch's build is started here.
      - name: Rebuild the site
        env:
          DOCS_DEPLOY_HOOK: ${{ secrets.DOCS_DEPLOY_HOOK }}
        run: |
          if [ -n "$DOCS_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$DOCS_DEPLOY_HOOK"
          else
            echo "::notice::DOCS_DEPLOY_HOOK is not set, so the site was not rebuilt."
          fi
