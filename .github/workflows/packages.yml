# Builds and checks Dictum's packages, each on its own OS: Native AOT cannot cross-compile.
# Called by ci.yml on every push and by release.yml on a tag.
name: Packages

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the packages
        shell: bash
        run: bash packaging/package.sh win-x64 "$RUNNER_TEMP/packages"

      - name: Check the packages (zip, MSI tables, files byte for byte)
        shell: bash
        run: DICTUM_PACKAGE_OUT="$RUNNER_TEMP/packages" bash packaging/tests/test-package.sh

      # Installing, upgrading and uninstalling the MSI (test-msi-install.ps1) runs on a person's machine: on a hosted
      # runner it hangs and GitHub keeps no log of the hung step.
      - name: The MSI smoke's helpers (installed products, msiexec arguments, the MSI log)
        shell: pwsh
        run: ./packaging/windows/test-msi-smoke.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: |
            ${{ runner.temp }}/packages/dictum-*-win-x64.zip
            ${{ runner.temp }}/packages/dictum-*-win-x64.msi

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install the native toolchain and the self-test's libraries
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb xauth libportaudio2 libice6 libsm6 libfontconfig1 libxext6

      - name: install.sh and uninstall.sh (stand-in programs, a throwaway HOME)
        run: bash packaging/linux/test-install.sh

      - name: Build the packages
        run: bash packaging/package.sh linux-x64 "$RUNNER_TEMP/packages"

      - name: Check the packages (tarball, AppImage, its self-test)
        run: DICTUM_PACKAGE_OUT="$RUNNER_TEMP/packages" bash packaging/tests/test-package.sh

      - name: Build and install the PKGBUILD in an Arch container
        run: bash packaging/linux/aur/test-pkgbuild.sh "$RUNNER_TEMP"/packages/dictum-*-linux-x64.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux
          path: |
            ${{ runner.temp }}/packages/dictum-*-linux-x64.tar.gz
            ${{ runner.temp }}/packages/dictum-*-linux-x64.AppImage
