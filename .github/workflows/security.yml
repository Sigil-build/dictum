# Checks that need no secret, so a fork's pull request runs them all:
# - gitleaks over every commit of every branch, with .gitleaks.toml (the CLI, pinned and checksum-checked:
#   gitleaks-action needs a paid license for an organization);
# - every NuGet package of the solution, transitive ones included, against the advisories nuget.org knows; the weekly
#   run catches an advisory published since the last change;
# - on a pull request, dependency review of the packages and actions it adds or changes.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  gitleaks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # gitleaks_8.30.1_linux_x64.tar.gz in the release's gitleaks_8.30.1_checksums.txt.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # git log -p over all refs: every commit of every branch and tag the checkout fetched, the pull request's too.
      - name: Scan the whole history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  nuget:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Without NuGetAudit here: with warnings as errors, an advisory would fail the restore, and the listing below,
      # which names each vulnerable package, would not run.
      - name: Restore
        run: dotnet restore Dictum.slnx -p:NuGetAudit=false

      - name: Vulnerable packages, transitive ones included
        id: vulnerable
        run: |
          set +e
          dotnet list Dictum.slnx package --vulnerable --include-transitive --no-restore --format json --output-version 1 > "$RUNNER_TEMP/vulnerable.json"
          listed=$?
          set -e
          bash .github/scripts/nuget-vulnerable.sh "$RUNNER_TEMP/vulnerable.json"
          if [ "$listed" -ne 0 ]; then
            echo "::error::dotnet list package exited with $listed."
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@v5.0.0
