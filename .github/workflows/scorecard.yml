# OpenSSF Scorecard grades the repository's security practices, publishes the result to api.scorecard.dev (the
# README's badge reads it there) and uploads it to code scanning. The Scorecard API accepts published results only
# from a workflow with no top-level env or defaults and no top-level write permission, whose job runs on a hosted
# Ubuntu runner and uses only checkout, upload-artifact, upload-sarif and Scorecard itself: no run steps here.
name: Scorecard

on:
  push:
    branches: [main]
  # Branch-Protection grades the rules as they are; a change to them starts a new run.
  branch_protection_rule:
  schedule:
    - cron: '17 5 * * 1'
  # A run that failed, or one wanted before the next Monday, started by hand.
  workflow_dispatch:

permissions:
  contents: read

# Every run grades main as it is then, so a newer one cancels the run it has made stale. The weekly run cancels
# nothing: it waits for a running one to finish. (The Scorecard API's check of this file, above, ignores concurrency.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  analysis:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # The OIDC token proves to the Scorecard API that this workflow produced the results it publishes.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Anyone can check the published results against this file for five days.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1upload-sarif
        with:
          sarif_file: results.sarif
