name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test (inside a D-Bus session for the tray tests)
        run: |
          sudo apt-get update && sudo apt-get install -y dbus libfontconfig1
          dbus-run-session -- dotnet test -c Release --no-build

      - name: Check catalog URLs
        env:
          DICTUM_CHECK_CATALOG: 1
        run: dotnet test -c Release --no-build --project tests/Dictum.Integration.Tests/Dictum.Integration.Tests.csproj --filter-class Dictum.Integration.Tests.CatalogUrlTests

  packages:
    needs: build-test
    uses: ./.github/workflows/packages.yml

  publish:
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install native toolchain and PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libportaudio2 xvfb libice6 libsm6 libfontconfig1 libxext6

      - name: Publish (Native AOT)
        run: dotnet publish src/Dictum.Cli -c Release -r ${{ matrix.rid }} -o out

      - name: Publish the desktop app (Native AOT)
        run: dotnet publish src/Dictum.App -c Release -r ${{ matrix.rid }} -o out

      - name: Self-test the desktop app
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./out/dictum-gui --self-test
          else
            ./out/dictum-gui --self-test
          fi

      - name: Overlay demo (X11 through xvfb, Native AOT)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./out/dictum-gui --overlay-demo fixtures/frames-silence.json --state 'done'

      - name: Smoke test published binary
        shell: bash
        env:
          DICTUM_CONFIG_DIR: ${{ runner.temp }}/dictum-config
          DICTUM_DATA_DIR: ${{ runner.temp }}/dictum-data
        run: |
          set -euo pipefail
          version="$(./out/dictum --version)"
          echo "dictum --version: $version"
          test -n "$version"

          ./out/dictum doctor --json

          # dictum init downloads the English test model and the VAD model, pinned and SHA-256 checked.
          ./out/dictum init --yes --language en --stt whisper-tiny-en --llm none --json
          # A second run finds every file in place (output captured first: grep -q would close the pipe early).
          again="$(./out/dictum init --yes --language en --stt whisper-tiny-en --llm none 2>&1)"
          grep -q "already in place" <<< "$again"

          # Runners have no GPU, so the 'auto' runtime falls back to CPU.
          text="$(./out/dictum transcribe fixtures/en.wav --raw)"
          echo "transcript: $text"
          grep -qi "country" <<< "$text"

      - uses: actions/upload-artifact@v7
        with:
          name: dictum-${{ matrix.rid }}
          path: |
            out/
            !out/*.pdb
            !out/*.dbg
            !out/*.dSYM

  # SharpHook's X11 backend needs glibc 2.38+, so the daemon runs on a newer image than the build.
  linux-daemon-smoke:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dictum-linux-x64
          path: out

      - name: Cache Whisper test model
        uses: actions/cache@v6
        with:
          path: models
          key: whisper-ggml-tiny.en

      - name: Download Whisper test model
        run: |
          mkdir -p models
          test -f models/ggml-tiny.en.bin || curl -fsSL -o models/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin

      - name: Daemon smoke test (X11, Secret Service, hotkey)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 xvfb xdotool xclip x11-utils dbus-x11 gnome-keyring libxtst6 libxt6 libxrandr2 libxkbcommon0
          chmod +x out/dictum
          bash .github/scripts/linux-daemon-smoke.sh "$PWD/out" "$PWD/models/ggml-tiny.en.bin" "$PWD/fixtures/en.wav"
