name: CI

# Once per change: a pull request's commits run as the pull request (whatever its base), main's after the merge. A push
# to any other branch or a tag runs nothing here; release.yml checks and builds a tag itself.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit on the same pull request, or on main, cancels the run it has made stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test (inside a D-Bus session for the tray tests)
        run: |
          sudo apt-get update && sudo apt-get install -y dbus libfontconfig1
          dbus-run-session -- dotnet test -c Release --no-build

      - name: Check catalog URLs
        env:
          DICTUM_CHECK_CATALOG: 1
        run: dotnet test -c Release --no-build --project tests/Dictum.Integration.Tests/Dictum.Integration.Tests.csproj --filter-class Dictum.Integration.Tests.CatalogUrlTests

  # The bash tests of the scripts that the release and the other workflows run (packaging/tests/test-*.sh but
  # test-package.sh, which packages.yml runs), on both runner images those workflows use, so a release is not the first
  # time a script meets the runner's bash, jq or git. They make no network request; check-version.sh asks MSBuild for
  # the version, hence the SDK.
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test the scripts
        run: |
          set -euo pipefail
          for test in packaging/tests/test-*.sh; do
            [ "$test" != packaging/tests/test-package.sh ] || continue
            echo "::group::$test"
            bash "$test"
            echo "::endgroup::"
          done

  packages:
    needs: build-test
    uses: ./.github/workflows/packages.yml

  publish:
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install native toolchain and PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libportaudio2 xvfb libice6 libsm6 libfontconfig1 libxext6

      - name: Publish (Native AOT)
        run: dotnet publish src/Dictum.Cli -c Release -r ${{ matrix.rid }} -o out

      - name: Publish the desktop app (Native AOT)
        run: dotnet publish src/Dictum.App -c Release -r ${{ matrix.rid }} -o out

      - name: Self-test the desktop app
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./out/dictum-gui --self-test
          else
            ./out/dictum-gui --self-test
          fi

      - name: Overlay demo (X11 through xvfb, Native AOT)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./out/dictum-gui --overlay-demo fixtures/frames-silence.json --state 'done'

      - name: Smoke test published binary
        shell: bash
        env:
          DICTUM_CONFIG_DIR: ${{ runner.temp }}/dictum-config
          DICTUM_DATA_DIR: ${{ runner.temp }}/dictum-data
        run: |
          set -euo pipefail
          version="$(./out/dictum --version)"
          echo "dictum --version: $version"
          test -n "$version"

          ./out/dictum doctor --json

          # dictum init downloads the English test model and the VAD model, pinned and SHA-256 checked.
          ./out/dictum init --yes --language en --stt whisper-tiny-en --llm none --json
          # A second run finds every file in place (output captured first: grep -q would close the pipe early).
          again="$(./out/dictum init --yes --language en --stt whisper-tiny-en --llm none 2>&1)"
          grep -q "already in place" <<< "$again"

          # Runners have no GPU, so the 'auto' runtime falls back to CPU.
          text="$(./out/dictum transcribe fixtures/en.wav --raw)"
          echo "transcript: $text"
          grep -qi "country" <<< "$text"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictum-${{ matrix.rid }}
          path: |
            out/
            !out/*.pdb
            !out/*.dbg
            !out/*.dSYM

  # SharpHook's X11 backend needs glibc 2.38+, so the daemon runs on a newer image than the build.
  linux-daemon-smoke:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The catalog's whisper-tiny-en (src/Dictum.Setup/catalog.json): the same pinned revision of
    # ggerganov/whisper.cpp and the same SHA-256, Hugging Face's LFS sha256 of the file.
    env:
      WHISPER_MODEL_REVISION: 5359861c739e955e79d9a303bcbc70fb988958b1
      WHISPER_MODEL_SHA256: 921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dictum-linux-x64
          path: out

      - name: Cache Whisper test model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: whisper-ggml-tiny.en-${{ env.WHISPER_MODEL_REVISION }}

      # Checked whether it came from the cache or from Hugging Face; a file that fails the check fails the job, so it
      # is never cached either.
      - name: Download Whisper test model
        run: |
          set -euo pipefail
          mkdir -p models
          test -f models/ggml-tiny.en.bin || curl --proto '=https' --tlsv1.2 -fsSL -o models/ggml-tiny.en.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/$WHISPER_MODEL_REVISION/ggml-tiny.en.bin"
          echo "$WHISPER_MODEL_SHA256  models/ggml-tiny.en.bin" | sha256sum -c -

      - name: Daemon smoke test (X11, Secret Service, hotkey)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 xvfb xdotool xclip x11-utils dbus-x11 gnome-keyring libxtst6 libxt6 libxrandr2 libxkbcommon0
          chmod +x out/dictum
          bash .github/scripts/linux-daemon-smoke.sh "$PWD/out" "$PWD/models/ggml-tiny.en.bin" "$PWD/fixtures/en.wav"
