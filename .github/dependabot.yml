# Weekly version updates as pull requests; nothing merges them but a person.
# NuGet: Dependabot reads Dictum.slnx and edits Directory.Packages.props (Central Package Management) and the
# msbuild-sdks of global.json. Packages that must stay on one version share a group, and so one pull request.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    # A package goes to the first group it matches: Avalonia.Headless stays with Avalonia, not with the tests.
    groups:
      avalonia:
        patterns: ['Avalonia', 'Avalonia.*']
      whisper:
        patterns: ['Whisper.net', 'Whisper.net.*']
      portaudio:
        patterns: ['org.k2fsa.portaudio.runtime.*']
      # WixToolset.Util.wixext is referenced only by packaging/windows/Dictum.Installer.wixproj, which Dependabot
      # does not read: a pull request that moves WixToolset.Sdk in global.json should move the extension along.
      wix:
        patterns: ['WixToolset.*']
      # The coverage extension builds on the Microsoft.Testing.Platform that xunit.v3 brings, so they move together.
      tests:
        patterns: ['xunit*', 'Microsoft.Testing.*']
      microsoft-extensions:
        patterns: ['Microsoft.Extensions.*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
